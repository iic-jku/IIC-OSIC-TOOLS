# Read only when the builder is created: after a change, run builder-clear.sh
# and builder-create.sh (this drops the local cache once).
#
# GC sizes use the reservedSpace, maxUsedSpace and minFreeSpace keys of
# BuildKit v0.17 and later (keepBytes and gckeepstorage are deprecated aliases
# of the reserved size). A rule with only that size prunes down to it, so the
# old 51 GB pruned every node below one full build. One full build left about
# 115 GB of cache per node (2026-11-23), so maxUsedSpace is about 3.5 times that.

[worker.oci]
  # limit the number of parallel build steps that can run at the same time
  max-parallelism = 6
  gc = true
  # Build context uploads, RUN --mount=type=cache and git checkouts: 4 weeks
  [[worker.oci.gcpolicy]]
    all = false
    filters = [ "type==source.local", "type==exec.cachemount", "type==source.git.checkout"]
    keepDuration = "672h"
    reservedSpace = "20GB"
    maxUsedSpace = "60GB"
  # Layers unused for 12 weeks
  [[worker.oci.gcpolicy]]
    all = false
    keepDuration = "2016h"
    reservedSpace = "200GB"
    maxUsedSpace = "400GB"
    minFreeSpace = "10%"
  [[worker.oci.gcpolicy]]
    all = false
    reservedSpace = "200GB"
    maxUsedSpace = "400GB"
    minFreeSpace = "10%"
  [[worker.oci.gcpolicy]]
    all = true
    reservedSpace = "200GB"
    maxUsedSpace = "400GB"
    minFreeSpace = "10%"

[registry."registry.iic.jku.at:5000"]
  http = true
